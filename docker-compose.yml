services:
  db:
    image: postgres:17-alpine          # pinned version, never :latest
    container_name: llmeval-db
    environment:
      POSTGRES_DB: ${DB_NAME}          # read from the root .env
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"                    # 5433 on your Mac, so it won't clash with any local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data survives container restarts
    networks:
      - llmeval_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  llmeval_network:
    driver: bridge
