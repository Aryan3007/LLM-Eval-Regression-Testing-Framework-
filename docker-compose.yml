name: llmeval

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: llmeval-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: docsbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    networks:
      - llmeval_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d docsbot']
      interval: 5s
      timeout: 5s
      retries: 10

  docsbot:
    build: ./examples/docsbot
    container_name: llmeval-docsbot
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/docsbot
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHAT_MODEL: ${CHAT_MODEL:-}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0}
      COLLECTION: ${DOCSBOT_COLLECTION:-fastapi-0.115.0-c512-o64}
      TOP_K: ${DOCSBOT_TOP_K:-5}
    ports:
      - '127.0.0.1:8001:8001'
    networks:
      - llmeval_network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  llmeval_network:
    driver: bridge
